name: Sync Garmin data

on:
  schedule:
    # 05:30 UTC todos los días (ajusta a tu franja horaria si quieres)
    - cron: "30 5 * * *"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Extraer datos de Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: python extract_garmin.py
